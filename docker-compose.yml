# docker-compose.yml (Development Environment)
services:
  dwh_exploration_postgres:
    image: postgres:17
    container_name: dwh_exploration_postgres
    environment:
      # Using variable expansion with default values for easier setup
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Bind mounts for database initialization and development
      - ./init_db:/docker-entrypoint-initdb.d
      - ./scripts:/workspace/scripts
      # Named volume for persistent data storage
      - dwh_exploration_postgres_volume:/var/lib/postgresql/data
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dwh_exploration_postgres_volume:
    name: dwh_exploration_postgres_volume
